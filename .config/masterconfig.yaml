# absolute path to your desired output path
root: /mnt/cbib/pangenoak_trials/GenomAsm4pg

####################### optional prejob - data preparation #######################
# path to tar data
data: /mnt/cbib/pangenoak_trails/GenomAsm4pg
# list of tar names
get_all_tar_filename: False
tarIDS: "<tar_filenames>"

####################### job - workflow #######################
# number of threads used by pigz
pigz_threads: 4
# k-mers size (reduce for small datasets)
km_size: 21 #Todo, add support for modularity of this value

### CONFIG 
IDS: ["purge", "no_purge"]

purge:
  run: purge
  fasta: "/mnt/cbib/pangenoak_trials/GenomAsm4pg/Q_alba.fasta.gz"
  ploidy: 2
  busco_lineage: eudicots_odb10
  assembly_purge_force: 3 
  run_purge_dups : True
  mode: default

no_purge:
  run: no_purge
  fasta: "/mnt/cbib/pangenoak_trials/GenomAsm4pg/Q_alba.fasta.gz"
  ploidy: 2
  busco_lineage: eudicots_odb10
  assembly_purge_force: 1
  run_purge_dups : False
  mode: default

####################### workflow output directories #######################
# results directory
resdir: results

### PREJOB
# extracted input data
rawdir: 00_input_data
bamdir: 00_input_data/bam_files
fastxdir: 00_input_data/fastx_files

### JOB
# QC
qcdir: 01_raw_data_QC
fqc: 01_fastQC
lqc: 02_longQC
gentools: 03_genometools
kmer: 04_kmer

# assembly
assembdir: 02_genome_assembly
asm_raw: 01_raw_assembly
asm_purged: 02_after_purge_dups_assembly
asm_conta: 03_uncontaminated_assembly
asm: 00_assembly
asm_qc: 01_assembly_QC
