# All per-sample options and their defaults
#
#   reads                           reads file (MANDATORY)
#   mode                            default | hi-c | trio | ont     (default: default)
#   r1, r2                          Hi-C R1/R2, or the two parents  (hi-c and trio)
#
#   busco_lineage                   compleasm/BUSCO lineage         (default: eukaryota_odb10)
#   use_busco                       True | False, BUSCO instead of compleasm (default: False)
#   kmer_size                       k for the QC steps              (default: 21)
#
#   run_purge_dups                  True | False                    (default: False)
#   assembly_purge_force            hifiasm -l, 1-3                 (default: 3)
#
#   run_downsampling                True | False                    (default: False)
#   target_coverage                                                 (default: 50)
#
#   run_quast                       True | False, needs             (default: False)
#
#   run_ragtag                      True | False, needs reference_genome   (default: False)
#   reference_genome                fasta.gz, for QUAST and RagTag
#
#   reference_chloroplast_genome    fasta. Given -> chloroplast reads are removed
#                                   BEFORE assembly and kept in 00_preprocess/
#   reference_mitochondrial_genome  [mitogenome.fasta, annotation.gb]. Given ->
#                                   mitochondrial contigs are removed FROM the final
#                                   assembly and MitoHiFi builds the mitogenome
#                                   from them. Both files are required.
#   mito_organism                   plant | animal | fungi, MitoHiFi -a    (default: plant)
