# Config file

samples:
  test_default:        
    fasta_gz: small_example.fasta.gz
    busco_lineage: eudicots_odb10              
  test_hi-c:        
    fasta_gz: small_example.fasta.gz
    mode: hi-c
    r1: small_example.fasta.gz
    r2: small_example.fasta.gz
    assembly_purge_force: 2
    busco_lineage: eudicots_odb10     


reference_genome : "my_reference.fasta.gz"
run_quast: True
run_ragtag: True

container_registry: "docker://registry.forgemia.inra.fr/asm4pg/genomasm4pg"
output_dir: "results/"


### JOB
# QC
qcdir: 01_raw_data_QC
fqc: 01_fastQC
lqc: 02_longQC
gentools: 03_genometools
kmer: 04_kmer

# assembly
assembdir: 02_genome_assembly
asm_raw: 01_raw_assembly
asm_purged: 02_after_purge_dups_assembly
asm_conta: 03_uncontaminated_assembly
asm: 00_assembly
asm_qc: 01_assembly_QC

# number of threads used by pigz
pigz_threads: 4