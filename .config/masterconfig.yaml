# Config file

samples:
  test_sample1:        
    fasta_gz: "input_reads.fa.gz"
    run: purge
    fasta: "Q_alba.fasta.gz"
    busco_lineage: eudicots_odb10
    mode: default                 

reference_genome : "my_reference.fasta.gz"
run_quast: True
run_ragtag: True

memory_multiplier: 100  # Multiplier for scaling memory across all rules
container_registry: "docker://registry.forgemia.inra.fr/pangepop/mspangepop"
output_dir: "results/"





### PREJOB
# extracted input data
rawdir: 00_input_data
bamdir: 00_input_data/bam_files
fastxdir: 00_input_data/fastx_files

### JOB
# QC
qcdir: 01_raw_data_QC
fqc: 01_fastQC
lqc: 02_longQC
gentools: 03_genometools
kmer: 04_kmer

# assembly
assembdir: 02_genome_assembly
asm_raw: 01_raw_assembly
asm_purged: 02_after_purge_dups_assembly
asm_conta: 03_uncontaminated_assembly
asm: 00_assembly
asm_qc: 01_assembly_QC

# number of threads used by pigz
pigz_threads: 4